# Portainer Swarm stack: portfolio-natee-v3 (api + web)
# Requires external networks from natee-database + natee-infra.
# Build on deploy (Portainer Git) or: docker build -t portfolio-natee-v3-api:latest .

version: "3.8"

services:
  api:
    image: portfolio-natee-v3-api:latest
    build: .
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DOMAIN: ${DOMAIN:?DOMAIN is required}
      BASE_URL: ${BASE_URL:?BASE_URL is required}
      FRONTEND_URL: ${FRONTEND_URL:-}
      PORT: ${PORT:-3121}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      PASSWORD_PEPPER: ${PASSWORD_PEPPER:?PASSWORD_PEPPER is required}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID is required}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?GOOGLE_CLIENT_SECRET is required}
      MINIO_HOST: ${MINIO_HOST:?MINIO_HOST is required}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-portfolio}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GENERATIVE_AI_API_KEY: ${GENERATIVE_AI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash}
      GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-gemini-embedding-001}
      AI_PUBLIC_DAILY_BUDGET: ${AI_PUBLIC_DAILY_BUDGET:-80}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
    ports:
      - target: 3121
        published: 3121
        protocol: tcp
        mode: ingress
    networks:
      - default
      - natee_db_net
      - natee_edge_net
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://127.0.0.1:3121/ping').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 128M

  # Frontend (Next.js) — built by portfolio-v3 GitHub Actions and loaded onto the node over SSH.
  # replicas: 0 until runtime env is confirmed; scale up manually in Portainer.
  # Nginx Proxy Manager reaches it on natee_edge_net at portfolio-natee-v3_web:3000.
  web:
    image: portfolio-v3-web:latest
    environment:
      NODE_ENV: production
      DOMAIN: ${WEB_DOMAIN:-}
      API_URL: ${WEB_API_URL:-http://api:3121}
      SUPABASE_SERVICE_ROLE_KEY: ${WEB_SUPABASE_SERVICE_ROLE_KEY:-}
      GH_READ_USER_TOKEN_PERSONAL: ${WEB_GH_READ_USER_TOKEN_PERSONAL:-}
      DEVTO_KEY: ${WEB_DEVTO_KEY:-}
      WAKATIME_API_KEY: ${WEB_WAKATIME_API_KEY:-}
      SPOTIFY_CLIENT_ID: ${WEB_SPOTIFY_CLIENT_ID:-}
      SPOTIFY_CLIENT_SECRET: ${WEB_SPOTIFY_CLIENT_SECRET:-}
      SPOTIFY_REFRESH_TOKEN: ${WEB_SPOTIFY_REFRESH_TOKEN:-}
      UMAMI_API_KEY: ${WEB_UMAMI_API_KEY:-}
      UMAMI_API_URL: ${WEB_UMAMI_API_URL:-}
      UMAMI_WEBSITE_ID: ${WEB_UMAMI_WEBSITE_ID:-}
      UMAMI_USERNAME: ${WEB_UMAMI_USERNAME:-}
      UMAMI_PASSWORD: ${WEB_UMAMI_PASSWORD:-}
      OPENWEATHERMAP_API_KEY: ${WEB_OPENWEATHERMAP_API_KEY:-}
      MONKEYTYPE_API_KEY: ${WEB_MONKEYTYPE_API_KEY:-}
    networks:
      - default
      - natee_edge_net
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      replicas: 0
      restart_policy:
        condition: on-failure
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

networks:
  default:
    driver: overlay
  natee_db_net:
    external: true
    name: natee-database_natee_db_net
  natee_edge_net:
    external: true
    name: natee-infra_natee_edge_net
