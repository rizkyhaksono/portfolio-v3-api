# Portainer Swarm stack: portfolio-natee-v3
# Requires external networks from natee-database + natee-infra.
# Build on deploy (Portainer Git) or: docker build -t portfolio-natee-v3-api:latest .

version: "3.8"

services:
  api:
    image: portfolio-natee-v3-api:latest
    build: .
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DOMAIN: ${DOMAIN:?DOMAIN is required}
      BASE_URL: ${BASE_URL:?BASE_URL is required}
      FRONTEND_URL: ${FRONTEND_URL:-}
      PORT: ${PORT:-3121}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      PASSWORD_PEPPER: ${PASSWORD_PEPPER:?PASSWORD_PEPPER is required}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID is required}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?GOOGLE_CLIENT_SECRET is required}
      MINIO_HOST: ${MINIO_HOST:?MINIO_HOST is required}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-portfolio}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GENERATIVE_AI_API_KEY: ${GENERATIVE_AI_API_KEY:-}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
    ports:
      - target: 3121
        published: 3121
        protocol: tcp
        mode: ingress
    networks:
      - default
      - natee_db_net
      - natee_edge_net
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://127.0.0.1:3121/ping').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 128M

networks:
  default:
    driver: overlay
  natee_db_net:
    external: true
    name: natee-database_natee_db_net
  natee_edge_net:
    external: true
    name: natee-infra_natee_edge_net
